<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Secure File Share</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; --error: #ef4444; --primary: #3b82f6; --primary-hover: #2563eb; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; }
        .login-card { background: var(--card); padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
        h2 { margin-top: 0; margin-bottom: 24px; font-weight: 700; letter-spacing: -0.5px;}
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        .form-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .btn-login { display: block; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 20px; }
        .btn-login:hover { background: var(--primary-hover); }
        .error { color: var(--error); list-style: none; padding: 10px; margin-bottom: 16px; font-size: 14px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.2);}
        .back-link { display: block; margin-top: 15px; font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 600; }
        .back-link:hover { color: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Authentication</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 30px;">Access requires admin email and password.</p>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="error">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label for="email">Admin Email Address</label>
                <input type="email" id="email" name="email" required placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Verify & Enter</button>
        </form>
        <a href="/" class="back-link">&larr; Back to Regular Login</a>
    </div>
</body>
</html>
